name: Secure API CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Security regression tests
        run: python -m pytest tests -v --junitxml=reports/tests.xml
      - name: Bandit SAST
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json
          bandit -r app
      - name: Python dependency audit
        run: pip-audit -r requirements.txt --strict -f json -o reports/pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-sast-pypi
          path: reports/
  owasp-sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check/data
          key: dependency-check-13-${{ github.run_id }}
          restore-keys: dependency-check-13-
      - name: Install OWASP Dependency Check 13
        run: |
          curl --fail --location --retry 3 -o /tmp/dc.zip https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip
          unzip -q /tmp/dc.zip -d /tmp
      - name: OWASP SCA fail on CVSS 7 or higher
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          mkdir -p reports/owasp
          args=()
          if [[ -n "$NVD_API_KEY" ]]; then
            args+=(--nvdApiKey "$NVD_API_KEY")
          else
            unset NVD_API_KEY
            args+=(--nvdDatafeed 'https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz')
          fi
          /tmp/dependency-check/bin/dependency-check.sh \
            --project secure-notes-api --scan requirements.txt \
            --enableExperimental --disableOssIndex \
            --suppression dependency-check-suppressions.xml \
            --data ~/.dependency-check/data --out reports/owasp \
            --format HTML --format JSON --failOnCVSS 7 "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: owasp-dependency-check
          path: reports/owasp/
