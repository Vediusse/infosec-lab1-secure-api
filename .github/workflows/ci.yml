name: Secure API CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Security regression tests
        run: python -m pytest tests -v --junitxml=reports/tests.xml
      - name: Bandit SAST
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json
          bandit -r app
      - name: Python dependency audit
        run: pip-audit -r requirements.txt --strict -f json -o reports/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-sast-pypi
          path: reports/
  owasp-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: dependency-check-13-${{ github.run_id }}
          restore-keys: dependency-check-13-
      - name: Install OWASP Dependency Check 13
        run: |
          curl --fail --location --retry 3 -o /tmp/dc.zip https://github.com/dependency-check/DependencyCheck/releases/download/v13.0.0/dependency-check-13.0.0-release.zip
          unzip -q /tmp/dc.zip -d /tmp
      - name: OWASP SCA fail on CVSS 7 or higher
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          args=()
          if [[ -n "$NVD_API_KEY" ]]; then args+=(--nvdApiKey "$NVD_API_KEY"); fi
          /tmp/dependency-check/bin/dependency-check.sh \
            --project secure-notes-api --scan requirements.txt \
            --enableExperimental --disableOssIndex \
            --data ~/.dependency-check/data --out reports/owasp \
            --format HTML --format JSON --failOnCVSS 7 "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check
          path: reports/owasp/
